# Supabase CLI configuration for LOCAL development (`supabase start`).
# Hosted projects are configured in the Supabase dashboard — mirror these
# auth settings there (see DEPLOYMENT.md).
project_id = "shiftpilot"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Sign-up stays enabled because invited users create their account through the
# invitation page. An account created without an invitation has no memberships
# and therefore no access to any data (enforced by RLS).
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_verifications = 30
